name: Auto-merge Jules PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is created by Jules
        id: check_jules
        run: |
          BODY="${{ github.event.pull_request.body }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Inspecting PR #${{ github.event.pull_request.number }}..."
          if echo "$BODY" | grep -q "PR created automatically by Jules" || echo "$BRANCH" | grep -Eq '[0-9]{15,}'; then
            echo "is_jules=true" >> $GITHUB_OUTPUT
            echo "Match confirmed: Jules PR."
          else
            echo "is_jules=false" >> $GITHUB_OUTPUT
            echo "Not a Jules PR, skipping auto-merge."
          fi

      - name: Approve PR
        if: steps.check_jules.outputs.is_jules == 'true'
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved Jules suggestion by GitHub Actions bot."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and Delete Branch
        if: steps.check_jules.outputs.is_jules == 'true'
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch --admin
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
